<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gIAm</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10161A">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#10161A;color:#E7ECEE;font-family:'Plus Jakarta Sans',sans-serif;
       padding-top:env(safe-area-inset-top,0)}
  .mono{font-family:'IBM Plex Mono',monospace}
  .muted{color:#7C8A90}
  .pantalla{padding:16px;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:96px}
  .oculta{display:none!important}
  .tarjeta{background:#1A2226;border-radius:12px;padding:12px;margin-bottom:10px}

  .btn-primario{width:100%;background:#4FB8A6;color:#0A2420;border:none;border-radius:12px;
                padding:15px;font-size:15px;font-weight:600;font-family:inherit}
  .btn-ghost{width:100%;background:transparent;color:#C2624A;border:1px solid #3A2A26;
             border-radius:12px;padding:13px;font-size:13px;font-family:inherit;margin-top:8px}
  .btn-retomar{width:100%;background:#D9A857;color:#3A2C0F;border:none;border-radius:12px;
               padding:13px;font-size:14px;font-weight:600;margin-bottom:14px;font-family:inherit}
  .btn-add{width:100%;background:#12181C;color:#4FB8A6;border:1px dashed #2E3A40;border-radius:12px;
           padding:13px;font-size:14px;font-family:inherit;margin-bottom:10px;font-weight:500}
  .btn-mini{background:#12181C;border:1px solid #262F34;color:#7C8A90;border-radius:8px;
            padding:7px 12px;font-size:12px;font-family:inherit}

  input[type=number],input[type=text],select{font-family:'IBM Plex Mono',monospace;font-size:16px;
    background:#12181C;border:1px solid #262F34;border-radius:8px;padding:10px 4px;color:#E7ECEE;
    width:100%;text-align:center}
  select{font-family:inherit;font-size:13px;text-align:left;padding:10px}
  input[type=number]:disabled{opacity:1;border-color:#2C4B47;color:#4FB8A6;background:#131C1E}
  textarea{width:100%;background:#1A2226;border:1px solid #262F34;border-radius:10px;color:#E7ECEE;
    font-family:inherit;padding:11px;font-size:14px;resize:vertical}

  .fila-serie{display:grid;grid-template-columns:20px 1fr 1fr 44px;gap:8px;align-items:center;
              padding:7px 0;border-top:1px solid #222B30}
  .fila-serie.sin-peso{grid-template-columns:20px 1fr 44px}
  .fila-serie.cronometrada{grid-template-columns:20px 1fr 44px 44px}
  .ref{padding:0 0 7px 28px;margin-top:-3px;font-size:10px}
  .btn-check{background:#12181C;border:1px solid #262F34;border-radius:9px;height:42px;color:#4FB8A6;font-size:17px}
  .confirmada .btn-check{background:#4FB8A6;color:#0A2420;border-color:#4FB8A6}
  .btn-play{background:#12181C;border:1px solid #262F34;border-radius:9px;height:42px;color:#D9A857;font-size:15px}
  .serie-ctrl{display:flex;gap:7px;margin-top:9px}

  .bloque-tit{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#5C666B;
              margin:18px 0 7px 2px;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:#12181C;border:1px solid #262F34;color:#9AA7AD;border-radius:999px;
        padding:9px 14px;font-size:13px;font-family:inherit}
  .chip.sel{background:#1D5C50;border-color:#4FB8A6;color:#DFF4EE;font-weight:500}

  .barra{position:sticky;top:0;z-index:50;background:#10161A;padding:10px 16px 12px;
         margin:0 -16px 6px;border-bottom:1px solid #1E272C}
  .barra-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .prog-track{height:4px;background:#1A2226;border-radius:2px;margin-top:9px;overflow:hidden}
  .prog-fill{height:100%;background:#4FB8A6;border-radius:2px;width:0;transition:width .3s}

  .fila-rutina{display:flex;justify-content:space-between;align-items:center}
  .hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
  .hm button{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;
          font-family:'IBM Plex Mono',monospace;font-size:11px;border:none;padding:0}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#131A1E;border-top:1px solid #1E272C;
       display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
  .nav button{flex:1;background:none;border:none;color:#5C666B;font-family:inherit;font-size:11px;
              padding:12px 0 13px;font-weight:500}
  .nav button.act{color:#4FB8A6}

  .modal{position:fixed;inset:0;background:rgba(6,10,12,.96);z-index:900;display:none;
         flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0))}
  .op-ej{display:flex;align-items:center;gap:11px;background:#1A2226;border-radius:11px;
         padding:11px;margin-bottom:7px;border:none;width:100%;text-align:left;color:#E7ECEE;font-family:inherit}
  .ed-fila{display:grid;grid-template-columns:1fr 62px 62px 38px;gap:7px;align-items:center;
           padding:8px 0;border-top:1px solid #222B30}
  .btn-del{background:#241A18;border:1px solid #3A2A26;color:#C2624A;border-radius:8px;height:40px;font-size:15px}
  .tabs{display:flex;gap:7px;margin-bottom:14px}
  .tab{flex:1;background:#12181C;border:1px solid #262F34;color:#7C8A90;border-radius:10px;
       padding:11px;font-size:13px;font-family:inherit;font-weight:500}
  .tab.act{background:#1D5C50;border-color:#4FB8A6;color:#DFF4EE}
</style>
</head>
<body>

<!-- ============ DASHBOARD ============ -->
<div id="pantalla-dashboard" class="pantalla">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <img src="https://i.ibb.co/GfNVsGmY/e4bf9f94-cf91-4f27-99cb-a3b90e174009-removebg-preview.png" alt="gIAm" style="height:30px">
    <span class="mono muted" style="font-size:12px" id="fecha-hoy"></span>
  </div>
  <div id="sync-dash" class="muted" style="font-size:11px;margin-bottom:12px"></div>

  <button id="banner-retomar" class="btn-retomar oculta" onclick="retomarRutina()"><span id="txt-retomar"></span></button>

  <div style="display:flex;gap:10px;margin-bottom:14px">
    <div class="tarjeta" style="flex:1;margin:0">

      <div id="st-vol" style="display:flex;align-items:baseline;gap:6px;margin-top:3px"></div>

    <div class="tarjeta" style="flex:1;margin:0">
      <div class="muted" style="font-size:10px">Sesiones / mes</div>
      <div id="st-ses" class="mono" style="font-size:17px;margin-top:3px"></div>
    </div>
  </div>

  <div class="bloque-tit" style="margin-top:0">Últimos 28 días · tocá un día para ver o corregir</div>
  <div id="heatmap" class="hm"></div>

  <div class="bloque-tit">Volumen semanal por grupo</div>
  <div id="por-grupo" class="tarjeta"></div>

  <div class="bloque-tit">Tus rutinas</div>
  <div id="lista-rutinas"></div>
</div>

<!-- ============ HISTORIA ============ -->
<div id="pantalla-historia" class="pantalla oculta">
  <div style="font-size:17px;font-weight:600;margin-bottom:14px">Historia</div>
  <div class="tabs">
    <button class="tab act" id="tab-graf" onclick="cambiarTab('graf')">Gráficos</button>
    <button class="tab" id="tab-rep" onclick="cambiarTab('rep')">Reportes</button>

    <div class="tarjeta">
      <div style="display:flex;gap:7px;margin-bottom:9px">

        <select id="f-rutina" onchange="aplicarFiltro()"></select>
      </div>
      <select id="f-ejercicio" onchange="aplicarFiltro()" style="margin-bottom:11px"></select>
      <div id="graf-filtro"></div>

  <div id="vista-rep" class="oculta"></div>
</div>

<!-- ============ DETALLE DE RUTINA ============ -->
<div id="pantalla-detalle" class="pantalla oculta">
  <div style="display:flex;align-items:center;gap:11px;margin-bottom:16px">
    <button onclick="irA('dashboard')" aria-label="Volver" style="background:none;border:none;color:#7C8A90;font-size:22px;padding:0;line-height:1">‹</button>
    <span style="font-size:17px;font-weight:600" id="det-nombre"></span>
  </div>
  <div class="tarjeta">
    <div class="muted" style="font-size:11px;margin-bottom:10px">Evolución del volumen (solo bloque rutina)</div>
    <div id="det-grafico"></div>
  </div>
  <button class="btn-primario" id="det-empezar">Empezar rutina</button>
</div>

<!-- ============ RUTINA ACTIVA ============ -->
<div id="pantalla-rutina" class="pantalla oculta">
  <div class="barra">
    <div class="barra-top">
      <button onclick="volverSinCerrar()" aria-label="Volver" style="background:none;border:none;color:#7C8A90;font-size:22px;padding:0;line-height:1">‹</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="rt-nombre"></div>
        <div class="mono muted" style="font-size:10px;margin-top:1px"><span id="rt-timer">00:00</span> · <span id="rt-pct">0%</span></div>

      <div style="text-align:right;min-width:86px">
        <div class="mono" style="font-size:19px;font-weight:500" id="rt-crono">–</div>

    <div class="prog-track"><div class="prog-fill" id="rt-prog"></div></div>

  <div class="tarjeta" style="margin-top:14px">
    <div class="muted" style="font-size:11px;margin-bottom:7px">Notas de la sesión</div>
    <textarea id="notas" rows="2" placeholder="Cómo te sentiste, algo a tener en cuenta..."></textarea>
  </div>

  <button class="btn-primario" onclick="terminarRutina()">Terminar rutina</button>
  <button class="btn-ghost" onclick="descartarRutina()">Descartar esta rutina</button>

<!-- ============ RESUMEN ============ -->

  <div class="tarjeta" style="text-align:center;padding:26px 16px">
    <div style="font-size:15px;color:#4FB8A6;margin-bottom:5px">Rutina guardada</div>
    <div style="font-size:19px;font-weight:600;margin-bottom:16px" id="rs-nombre"></div>
    <div class="muted" style="font-size:13px"><span class="mono" id="rs-series"></span> series registradas</div>
  </div>

</div>

<!-- ============ NAV ============ -->
<div class="nav" id="nav">
  <button id="nav-dash" class="act" onclick="irA('dashboard')">Inicio</button>
  <button id="nav-hist" onclick="irA('historia')">Historia</button>
</div>

<!-- ============ MODAL AGREGAR EJERCICIO ============ -->
<div id="modal-add" class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-size:16px;font-weight:600">Agregar ejercicio</span>
    <button onclick="cerrarModal('modal-add')" style="background:none;border:none;color:#7C8A90;font-size:26px;line-height:1">×</button>
  </div>
  <div id="modal-lista" style="overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch"></div>
</div>

<!-- ============ MODAL DIA / EDITOR HISTORICO ============ -->
<div id="modal-dia" class="modal">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <span style="font-size:16px;font-weight:600" id="dia-titulo"></span>
    <button onclick="cerrarModal('modal-dia')" style="background:none;border:none;color:#7C8A90;font-size:26px;line-height:1">×</button>
  </div>
  <div class="muted mono" style="font-size:11px;margin-bottom:12px" id="dia-sub"></div>
  <div id="dia-cont" style="overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch"></div>
  <div id="dia-acciones" style="padding-top:12px"></div>
</div>

<!-- ============ LIGHTBOX ============ -->
<div id="lightbox" onclick="cerrarLightbox()" style="position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:999;display:none;align-items:center;justify-content:center;padding:22px">
  <img id="lightbox-img" alt="" style="max-width:100%;max-height:100%;border-radius:10px">
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfsmj4R7Fkqiesr6XMon5puBSeAk1QnK94e-VZStQfxkRl2rxlEyoYRzl6JpYSsk8z/exec';
const DESCANSO_SEG = 60;
const BLOQUES = ['calentamiento','rutina','abdominales','terminacion'];
const TITULOS = {calentamiento:'Calentamiento',rutina:'Rutina',abdominales:'Abdominales',terminacion:'Terminación',extra:'Agregados'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ---------- IndexedDB ---------- */
const DB_NAME='giam_db', DB_VER=1;
function abrirDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,DB_VER);
  q.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('queue'))db.createObjectStore('queue',{keyPath:'id'});
    if(!db.objectStoreNames.contains('snapshot'))db.createObjectStore('snapshot');
    if(!db.objectStoreNames.contains('sesion'))db.createObjectStore('sesion');};
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbPut(s,v,k){const db=await abrirDB();return new Promise((res,rej)=>{
  const t=db.transaction(s,'readwrite'),st=t.objectStore(s),q=(k!==undefined)?st.put(v,k):st.put(v);
  q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}
async function idbGet(s,k){const db=await abrirDB();return new Promise((res,rej)=>{
  const q=db.transaction(s,'readonly').objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbGetAll(s){const db=await abrirDB();return new Promise((res,rej)=>{
  const q=db.transaction(s,'readonly').objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}
async function idbDel(s,k){const db=await abrirDB();return new Promise((res,rej)=>{
  const q=db.transaction(s,'readwrite').objectStore(s).delete(k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}

/* ---------- utils ---------- */
function generarId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));}
function fechaHoy(){const d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}
function fmt(n){const x=Number(n);return isNaN(x)?'0':Math.round(x).toLocaleString('es-AR');}
function esc(s){return (s===null||s===undefined)?'':s.toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return (s===null||s===undefined)?'':s.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function parsearFecha(v){if(!v)return null;const s=v.toString().trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){const d=new Date(s);return isNaN(d.getTime())?null:d;}
  const p=s.split(/[\/\-]/);if(p.length===3){const dd=+p[0],mm=+p[1];let aa=+p[2];if(aa<100)aa+=2000;
    if(!isNaN(dd)&&!isNaN(mm)&&!isNaN(aa)){const d=new Date(aa,mm-1,dd);return isNaN(d.getTime())?null:d;}}
  const f=new Date(s);return isNaN(f.getTime())?null:f;}
function tsDia(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function esTiempo(u){const n=norm(u);return n==='minutos'||n==='segundos';}
function fechaStr(d){return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}

/* ---------- estado ---------- */
let datosApp=null, sesion=null, tIntervalo=null, sincronizando=false;
let cronoTipo='descanso', cronoRestante=0, cronoActivo=false, wakeLock=null;
let diaEditando=null;

/* ---------- audio ---------- */
let audioCtx=null;
function beep(freq,dur){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type='sine';
  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
  o.start();o.stop(audioCtx.currentTime+dur+0.02);}catch(e){}}

/* ---------- wake lock ---------- */
async function pedirWakeLock(){try{if('wakeLock' in navigator&&!wakeLock){
  wakeLock=await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}}
function soltarWakeLock(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&!document.getElementById('pantalla-rutina').classList.contains('oculta'))pedirWakeLock();});

/* ---------- navegación ---------- */
function mostrarPantalla(id){
  document.querySelectorAll('.pantalla').forEach(p=>p.classList.add('oculta'));
  document.getElementById('pantalla-'+id).classList.remove('oculta');
  window.scrollTo(0,0);
  const nav=document.getElementById('nav');
  if(id==='rutina'||id==='resumen')nav.classList.add('oculta');else nav.classList.remove('oculta');
  document.getElementById('nav-dash').classList.toggle('act',id==='dashboard'||id==='detalle');
  document.getElementById('nav-hist').classList.toggle('act',id==='historia');
  if(id!=='rutina')soltarWakeLock();
}
function irA(id){
  mostrarPantalla(id);
  if(id==='dashboard'){renderDashboard();refrescar();}
  if(id==='historia'){renderHistoria();}
}

/* ---------- sync ---------- */
async function encolar(item){await idbPut('queue',item);indicadores();sincronizar();}
async function sincronizar(){
  if(sincronizando||!navigator.onLine)return;
  sincronizando=true;
  try{
    const p=await idbGetAll('queue');
    if(!p.length){sincronizando=false;indicadores();return;}
    const r=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(p)});
    const d=await r.json();
    if(d.status==='ok'&&Array.isArray(d.confirmados)){for(const id of d.confirmados)await idbDel('queue',id);}
  }catch(e){}
  finally{sincronizando=false;indicadores();}
}
async function indicadores(){
  const p=await idbGetAll('queue');
  const txt=p.length===0?(navigator.onLine?'● Todo sincronizado':'● Sin conexión (guardado local)')
                        :('● '+p.length+' pendiente'+(p.length>1?'s':'')+' de enviar');
  const col=p.length===0?'#4FB8A6':'#D9A857';
  ['sync-dash','sync-rt'].forEach(id=>{const e=document.getElementById(id);if(e){e.textContent=txt;e.style.color=col;}});
}
window.addEventListener('online',()=>{sincronizar();indicadores();});
window.addEventListener('offline',indicadores);
setInterval(sincronizar,15000);

/* ---------- carga ---------- */
async function cargarApp(){const c=await idbGet('snapshot','main');if(c){datosApp=c;renderDashboard();}refrescar();}
async function refrescar(){
  if(!navigator.onLine)return;
  try{const r=await fetch(APPS_SCRIPT_URL);const d=await r.json();
    if(d.status==='ok'){datosApp=d;await idbPut('snapshot',d,'main');renderDashboard();}}catch(e){}
}

/* ---------- gráficos ---------- */
function sparkline(v){
  if(!v||v.length<2)return '';
  const mx=Math.max.apply(null,v),mn=Math.min.apply(null,v),rg=(mx-mn)||1,w=56,h=22,pd=3;
  const pts=v.map((x,i)=>((i/(v.length-1))*w).toFixed(1)+','+(h-pd-((x-mn)/rg)*(h-pd*2)).toFixed(1)).join(' ');
  const col=v[v.length-1]>=v[0]?'#4FB8A6':'#D9A857';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+
         '" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function graficoGrande(f,v){
  if(!v||v.length<2)return '<p class="muted" style="font-size:13px">No hay suficientes sesiones para graficar.</p>';
  const mx=Math.max.apply(null,v),mn=Math.min.apply(null,v),rg=(mx-mn)||1,w=320,h=120,pd=12;
  const P=v.map((x,i)=>({x:pd+(i/(v.length-1))*(w-pd*2),y:h-pd-((x-mn)/rg)*(h-pd*2)}));
  const line=P.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots=P.map((p,i)=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="#4FB8A6"><title>'+fmt(v[i])+'</title></circle>').join('');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block"><polyline points="'+line+
    '" fill="none" stroke="#4FB8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>'+
    '<div class="mono muted" style="display:flex;font-size:9px;margin-top:5px">'+
    f.map(x=>'<span style="flex:1;text-align:center">'+esc(x)+'</span>').join('')+'</div>';
}

/* ---------- dashboard ---------- */
function mapaHeat(){
  const m={};
  const h=(datosApp&&datosApp.heatmap)||{};
  Object.keys(h).forEach(k=>{const d=parsearFecha(h[k].fecha||k);if(d)m[tsDia(d)]=h[k];});
  return m;
}
function renderHeatmap(){
  const m=mapaHeat(),hoy=tsDia(new Date()),out=[];
  for(let i=27;i>=0;i--){
    const ts=hoy-i*86400000,d=new Date(ts),info=m[ts],esHoy=(i===0);
    const bg=info?(esHoy?'#4FB8A6':'#1D5C50'):'#1A2226';
    const fg=info?(esHoy?'#0A2420':'#DFF4EE'):'#5C666B';
    const bd=esHoy?'border:1px solid #DFF4EE;':'';
    out.push('<button style="background:'+bg+';color:'+fg+';'+bd+'" data-ts="'+ts+'">'+d.getDate()+'</button>');
  }
  document.getElementById('heatmap').innerHTML=out.join('');
}
function statsSemana(){
  const reps=(datosApp&&datosApp.reportes)||[],hoy=tsDia(new Date());
  let vs=0,va=0,sm=0;
  reps.forEach(r=>{const d=parsearFecha(r.fecha);if(!d)return;
    const dd=Math.round((hoy-tsDia(d))/86400000),v=Number(r.volumen)||0;
    if(dd>=0&&dd<7)vs+=v; if(dd>=7&&dd<14)va+=v; if(dd>=0&&dd<30)sm++;});
  return {vs,va,sm};
}
function renderPorGrupo(){
  const g=(datosApp&&datosApp.volumenPorGrupo)||{};
  const keys=Object.keys(g).filter(k=>g[k]>0).sort((a,b)=>g[b]-g[a]);
  const c=document.getElementById('por-grupo');
  if(!keys.length){c.innerHTML='<div class="muted" style="font-size:12px">Sin registros en los últimos 7 días.</div>';return;}
  const max=g[keys[0]];
  c.innerHTML=keys.map(k=>'<div style="margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">'+
    '<span>'+esc(k)+'</span><span class="mono muted">'+fmt(g[k])+'</span></div>'+
    '<div style="height:4px;background:#12181C;border-radius:2px;overflow:hidden">'+
    '<div style="height:100%;width:'+Math.round(g[k]/max*100)+'%;background:#4FB8A6"></div></div></div>').join('');
}
function renderDashboard(){
  document.getElementById('fecha-hoy').textContent=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  const b=document.getElementById('banner-retomar');
  if(sesion){b.classList.remove('oculta');document.getElementById('txt-retomar').textContent='Retomar: '+sesion.rutinaNombre;}
  else b.classList.add('oculta');
  if(!datosApp){document.getElementById('lista-rutinas').innerHTML='<p class="muted">Cargando...</p>';return;}

  const s=statsSemana();
  const pct=s.va>0?Math.round((s.vs-s.va)/s.va*100):null;
  document.getElementById('st-vol').innerHTML='<span class="mono" style="font-size:17px">'+fmt(s.vs)+'</span>'+
    (pct!==null?'<span class="mono" style="font-size:11px;color:'+(pct>=0?'#D9A857':'#7C8A90')+'">'+(pct>=0?'▲':'▼')+Math.abs(pct)+'%</span>':'');
  document.getElementById('st-ses').textContent=s.sm;
  renderHeatmap();renderPorGrupo();

  document.getElementById('lista-rutinas').innerHTML=(datosApp.rutinas||[]).map(r=>{
    const reps=(datosApp.reportes||[]).filter(x=>x.rutinaId===r.id);
    const ult=reps.length?reps[0].fecha:null;

    return '<div class="tarjeta fila-rutina" data-rid="'+esc(r.id)+'" data-rnom="'+esc(r.nombre)+'">'+
      '<div><div style="font-weight:600">'+esc(r.nombre)+'</div>'+
      '<div class="muted" style="font-size:11px;margin-top:2px">'+(ult?'Última: '+esc(ult):'Sin registros todavía')+'</div></div>'+
      (sparkline(st)||'<span style="color:#4FB8A6;font-size:18px">›</span>')+'</div>';
  }).join('');
}

function precarga(ej,i){const h=(datosApp.historial&&datosApp.historial[ej])||[];return h[i]||null;}
function defEjercicio(n){return (datosApp.catalogo||[]).find(e=>norm(e.ejercicio)===norm(n))||null;}

async function iniciarRutina(rid){
  const r=(datosApp.rutinas||[]).find(x=>x.id===rid);
  if(!r)return;
  const ejs=ejerciciosDe(rid);
  const cal=ejs.find(e=>e.bloque==='calentamiento'), ter=ejs.find(e=>e.bloque==='terminacion');
  sesion={rutinaId:rid,rutinaNombre:r.nombre,inicio:Date.now(),series:[],extras:[],seriesExtra:{},
          selCal:cal?cal.ejercicio:null,selTer:ter?ter.ejercicio:null};

}

function volverSinCerrar(){clearInterval(tIntervalo);soltarWakeLock();irA('dashboard');}

function cantSeries(def){
  const extra=sesion.seriesExtra&&sesion.seriesExtra[norm(def.ejercicio)];
  return Math.max(1,(Number(def.cantidadSeries)||1)+(extra||0));
}

function filasDe(def,extra){
  const cant=cantSeries(def), tiempo=esTiempo(def.udmRep), conPeso=!tiempo;
  let html='';
  for(let i=0;i<cant;i++){
    const p=precarga(def.ejercicio,i)||precarga(def.ejercicio,0);
    const peso=p?p.peso:'';
    const cls='fila-serie'+(tiempo?' cronometrada':'');
    html+='<div class="'+cls+'" data-ej="'+esc(def.ejercicio)+'" data-i="'+i+'" data-udm="'+esc(def.udmRep)+'" data-extra="'+(extra?'1':'0')+'">'+
      '<span class="mono muted" style="font-size:11px">'+(i+1)+'</span>'+
      (conPeso?'<input type="number" class="in-peso" placeholder="kg" value="'+esc(peso==='N/A'?'':peso)+'" inputmode="decimal">':'')+
      '<input type="number" class="in-val" value="'+esc(def.repsObjetivo)+'" inputmode="numeric">'+
      (tiempo?'<button class="btn-play" onclick="arrancarCrono(this)" aria-label="Iniciar">▶</button>':'')+
      '<button class="btn-check" onclick="marcar(this)" aria-label="Marcar">✓</button></div>'+
      '<div class="ref muted mono">'+(precarga(def.ejercicio,i)?'Última vez: '+esc(precarga(def.ejercicio,i).valor)+' '+esc(precarga(def.ejercicio,i).unidad):'&nbsp;')+'</div>';
  }
  const k=esc(def.ejercicio).replace(/'/g,"\\'");
  html+='<div class="serie-ctrl">'+
    '<button class="btn-mini" onclick="ajustarSeries(\''+k+'\',1)">+ serie</button>'+
    '<button class="btn-mini" onclick="ajustarSeries(\''+k+'\',-1)">− serie</button></div>';
  return html;
}

async function ajustarSeries(ejercicio,delta){
  const k=norm(ejercicio);
  if(!sesion.seriesExtra)sesion.seriesExtra={};
  const def=defEjercicio(ejercicio);if(!def)return;
  const base=Number(def.cantidadSeries)||1;
  const actual=(sesion.seriesExtra[k]||0);
  const nuevo=actual+delta;
  if(base+nuevo<1)return;
  if(delta<0){
    const idx=base+nuevo;
    const aBorrar=sesion.series.filter(s=>norm(s.ejercicio)===k&&(parseInt(s.serie.replace(/\D/g,''),10)-1)>=idx);
    if(aBorrar.length&&!confirm('Esa serie ya está marcada. ¿Quitarla igual?'))return;
    for(const s of aBorrar){await idbDel('queue',s.id);}
    sesion.series=sesion.series.filter(s=>!(norm(s.ejercicio)===k&&(parseInt(s.serie.replace(/\D/g,''),10)-1)>=idx));
  }
  sesion.seriesExtra[k]=nuevo;
  await guardarSesion();renderBloques();
}

function tarjetaEjercicio(def,extra){
  const img=def.media?'<img src="'+esc(def.media)+'" data-full="'+esc(def.media)+'" class="foto" loading="lazy" style="width:42px;height:42px;border-radius:9px;object-fit:cover;background:#12181C;flex-shrink:0" onerror="this.style.display=\'none\'">':'';
  return '<div class="tarjeta">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">'+img+
    '<div style="flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px">'+
    '<span style="font-weight:600;font-size:14px">'+esc(def.ejercicio)+'</span>'+
    '<span class="muted mono" style="font-size:10px;white-space:nowrap">'+cantSeries(def)+' x '+esc(def.repsObjetivo)+'</span>'+
    '</div></div>'+filasDe(def,extra)+'</div>';
}
function chipsSelector(bloque){
  const sel=bloque==='calentamiento'?sesion.selCal:sesion.selTer;
  return '<div class="chips">'+opcionesCardio().map(e=>
    '<button class="chip'+(norm(e.ejercicio)===norm(sel)?' sel':'')+'" onclick="elegirCardio(\''+bloque+'\',\''+esc(e.ejercicio).replace(/'/g,"\\'")+'\')">'+
    esc(e.ejercicio)+'</button>').join('')+'</div>';
}
function renderBloques(){
  const ejs=ejerciciosDe(sesion.rutinaId);
  let html='';
  BLOQUES.forEach(b=>{
    html+='<div class="bloque-tit">'+TITULOS[b]+'</div>';
    if(b==='calentamiento'||b==='terminacion'){
      html+=chipsSelector(b);
      const nom=b==='calentamiento'?sesion.selCal:sesion.selTer;
      const def=nom?defEjercicio(nom):null;
      html+=def?tarjetaEjercicio(def,false):'<div class="tarjeta muted" style="font-size:12px">Elegí un ejercicio arriba.</div>';
    }else{
      const lista=ejs.filter(e=>e.bloque===b);
      html+=lista.length?lista.map(e=>tarjetaEjercicio(e,false)).join('')
                        :'<div class="tarjeta muted" style="font-size:12px">Sin ejercicios en este bloque.</div>';
      if(b==='rutina'){
        if(sesion.extras.length){
          html+='<div class="bloque-tit">'+TITULOS.extra+'</div>';
          html+=sesion.extras.map(n=>{const d=defEjercicio(n);return d?tarjetaEjercicio(d,true):'';}).join('');
        }
        html+='<button class="btn-add" onclick="abrirModalAdd()">+ Agregar ejercicio</button>';
      }
    }
  });
  document.getElementById('cont-bloques').innerHTML=html;
  sesion.series.forEach(restaurar);
  actualizarProgreso();
}
async function elegirCardio(bloque,nombre){
  if(bloque==='calentamiento')sesion.selCal=nombre;else sesion.selTer=nombre;
  await guardarSesion();renderBloques();
}
function restaurar(item){
  const i=parseInt(item.serie.replace(/\D/g,''),10)-1;
  const f=document.querySelector('.fila-serie[data-ej="'+CSS.escape(item.ejercicio)+'"][data-i="'+i+'"]');
  if(!f)return;
  const p=f.querySelector('.in-peso');if(p)p.value=(item.peso==='N/A'?'':item.peso);
  f.querySelector('.in-val').value=item.valor;
  f.dataset.id=item.id;f.classList.add('confirmada');
  f.querySelectorAll('input').forEach(x=>{x.disabled=true;});
}
async function marcar(btn){
  const f=btn.closest('.fila-serie');
  if(f.classList.contains('confirmada')){
    f.classList.remove('confirmada');
    f.querySelectorAll('input').forEach(x=>{x.disabled=false;});
    return;
  }
  const ip=f.querySelector('.in-peso'),iv=f.querySelector('.in-val');
  const peso=ip?ip.value:'',val=iv.value;
  if(val===''){f.style.outline='1px solid #C2624A';setTimeout(()=>{f.style.outline='none';},1200);return;}
  let id=f.dataset.id;if(!id){id=generarId();f.dataset.id=id;}
  const item={id:id,type:'set',fecha:fechaHoy(),rutinaId:sesion.rutinaId,
    ejercicio:f.dataset.ej,serie:'Serie '+(Number(f.dataset.i)+1),
    valor:val,peso:(peso===''?'N/A':peso),unidad:f.dataset.udm,extra:f.dataset.extra==='1'};
  sesion.series=sesion.series.filter(s=>s.id!==id);
  sesion.series.push(item);
  await guardarSesion();await encolar(item);
  f.classList.add('confirmada');
  f.querySelectorAll('input').forEach(x=>{x.disabled=true;});
  iniciarDescanso();actualizarProgreso();
}
function actualizarProgreso(){
  const ejs=ejerciciosDe(sesion.rutinaId).filter(e=>e.bloque==='rutina');
  let total=0;ejs.forEach(e=>{total+=cantSeries(e);});
  const nombres=ejs.map(e=>norm(e.ejercicio));
  const hechas=sesion.series.filter(s=>!s.extra&&nombres.indexOf(norm(s.ejercicio))!==-1).length;
  const pct=total>0?Math.min(100,Math.round(hechas/total*100)):0;
  document.getElementById('rt-pct').textContent=pct+'%';
  document.getElementById('rt-prog').style.width=pct+'%';
}

      (e.media?'<img src="'+esc(e.media)+'" loading="lazy" style="width:38px;height:38px;border-radius:8px;object-fit:cover;background:#12181C;flex-shrink:0" onerror="this.style.display=\'none\'">':'')+
      '<span style="flex:1;font-size:14px">'+esc(e.ejercicio)+'</span>'+
      '<span class="mono muted" style="font-size:10px">'+(Number(e.cantidadSeries)||1)+' x '+esc(e.repsObjetivo)+'</span>'+
      '</button>').join('')).join(''):'<p class="muted">No quedan ejercicios para agregar.</p>';
  document.getElementById('modal-add').style.display='flex';
}
function cerrarModal(id){document.getElementById(id).style.display='none';}
async function agregarExtra(nombre){
  if(!sesion.extras.some(n=>norm(n)===norm(nombre)))sesion.extras.push(nombre);
  await guardarSesion();cerrarModal('modal-add');renderBloques();
}

/* ---------- cronómetros ---------- */
function pintarCrono(){
  const el=document.getElementById('rt-crono'),lb=document.getElementById('rt-crono-lbl');
  if(!cronoActivo){el.textContent='–';el.style.color='#3A444A';lb.textContent='descanso';return;}
  const m=Math.floor(cronoRestante/60),s=cronoRestante%60;
  el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.style.color=cronoTipo==='ejercicio'?'#D9A857':'#4FB8A6';
  lb.textContent=cronoTipo==='ejercicio'?'ejercicio':'descanso';
}
function iniciarDescanso(){cronoTipo='descanso';cronoRestante=DESCANSO_SEG;cronoActivo=true;pintarCrono();}
function arrancarCrono(btn){
  const f=btn.closest('.fila-serie');
  const val=parseFloat(f.querySelector('.in-val').value)||0;
  const seg=norm(f.dataset.udm)==='minutos'?Math.round(val*60):Math.round(val);
  if(seg<=0)return;
  cronoTipo='ejercicio';cronoRestante=seg;cronoActivo=true;pintarCrono();beep(660,0.08);
}
function tickCrono(){
  if(!cronoActivo)return;
  cronoRestante--;
  if(cronoRestante<=3&&cronoRestante>0)beep(660,0.08);
  if(cronoRestante<=0){beep(880,0.35);cronoActivo=false;}
  pintarCrono();
}
function arrancarTimer(){
  clearInterval(tIntervalo);
  tIntervalo=setInterval(()=>{
    if(sesion){const t=Math.floor((Date.now()-sesion.inicio)/1000);
      document.getElementById('rt-timer').textContent=
        String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
    tickCrono();
  },1000);
}

/* ---------- guardar / terminar ---------- */
async function guardarSesion(){
  if(!sesion)return;
  const n=document.getElementById('notas');if(n)sesion.notas=n.value;
  await idbPut('sesion',sesion,'actual');
}
async function descartarRutina(){
  if(!confirm('¿Descartar esta rutina? Se borra el progreso de esta sesión. El resto de tus datos no se toca.'))return;
  for(const s of sesion.series)await idbDel('queue',s.id);
  await idbDel('sesion','actual');
  sesion=null;cronoActivo=false;clearInterval(tIntervalo);soltarWakeLock();
  irA('dashboard');indicadores();
}
async function terminarRutina(){
  const mins=Math.round((Date.now()-sesion.inicio)/60000);
  await encolar({id:generarId(),type:'summary',fecha:fechaHoy(),rutinaId:sesion.rutinaId,
    rutinaNombre:sesion.rutinaNombre,tiempo:mins+' min',comentarios:document.getElementById('notas').value||''});
  clearInterval(tIntervalo);cronoActivo=false;soltarWakeLock();
  document.getElementById('rs-nombre').textContent=sesion.rutinaNombre;
  document.getElementById('rs-series').textContent=sesion.series.length;
  await idbDel('sesion','actual');
  sesion=null;mostrarPantalla('resumen');
}

/* ---------- lightbox ---------- */
function abrirLightbox(u){document.getElementById('lightbox-img').src=u;document.getElementById('lightbox').style.display='flex';}
function cerrarLightbox(){document.getElementById('lightbox').style.display='none';}

/* ---------- arranque ---------- */
document.addEventListener('DOMContentLoaded',async()=>{
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  document.getElementById('lista-rutinas').addEventListener('click',e=>{
    const f=e.target.closest('.fila-rutina');if(f)abrirDetalle(f.dataset.rid,f.dataset.rnom);});
  document.getElementById('heatmap').addEventListener('click',e=>{
    const b=e.target.closest('button');if(b&&b.dataset.ts)abrirDia(b.dataset.ts);});
  document.getElementById('cont-bloques').addEventListener('click',e=>{
    if(e.target.classList.contains('foto'))abrirLightbox(e.target.dataset.full);});
  document.getElementById('notas').addEventListener('input',()=>{if(sesion)guardarSesion();});
  document.body.addEventListener('touchstart',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();},{once:true});
  sesion=(await idbGet('sesion','actual'))||null;
  await cargarApp();indicadores();
});
</script>
