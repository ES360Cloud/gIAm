<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Luce Aprende!</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/B5704YPp/asd-1-1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-blue: #4facfe;
            --secondary-blue: #00f2fe;
            --primary-pink: #ff758c;
            --secondary-pink: #ff7eb3;
            --bg-color: #f3f8ff;
            --text-main: #334155;
            --text-light: #64748b;
            --white: #ffffff;
            --highlight-bg: #fffbe8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.1), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 117, 140, 0.1), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        h1, h2, h3 { font-family: 'Fredoka', sans-serif; text-align: center; }

        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: ''; position: absolute; top: -50px; left: -50px;
            width: 150px; height: 150px;
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            border-radius: 50%; opacity: 0.1; z-index: 0;
        }
        .app-container::after {
            content: ''; position: absolute; bottom: -50px; right: -50px;
            width: 200px; height: 200px;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            border-radius: 50%; opacity: 0.1; z-index: 0;
        }

        .content-wrapper { position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 40px; display: flex; flex-direction: column; align-items: center; }
        .header img {
            width: 100px; height: 100px; border-radius: 25px; margin-bottom: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); object-fit: cover;
        }
        .header h1 {
            font-size: 3rem;
            background: linear-gradient(to right, var(--primary-blue), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { font-size: 1.2rem; color: var(--text-light); }

        .view { display: none; animation: fadeIn 0.5s ease-in-out; }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }

        .menu-btn {
            background: var(--white); border: 3px solid transparent;
            border-radius: 25px; padding: 40px 20px; text-align: center;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .menu-btn.blue { border-color: rgba(79, 172, 254, 0.3); }
        .menu-btn.pink { border-color: rgba(255, 117, 140, 0.3); }

        .menu-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .menu-btn.blue:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.1), rgba(0, 242, 254, 0.1));
            border-color: var(--primary-blue);
        }
        .menu-btn.pink:hover {
            background: linear-gradient(135deg, rgba(255, 117, 140, 0.1), rgba(255, 126, 179, 0.1));
            border-color: var(--primary-pink);
        }

        .menu-btn i { font-size: 4rem; }
        .menu-btn.blue i { color: var(--primary-blue); }
        .menu-btn.pink i { color: var(--primary-pink); }
        .menu-btn span {
            font-family: 'Fredoka', sans-serif; font-size: 1.8rem;
            font-weight: 600; color: var(--text-main);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

        .btn-back {
            background: none; border: none; color: var(--text-light);
            font-size: 1.2rem; font-family: 'Nunito', sans-serif; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: color 0.2s;
        }
        .btn-back:hover { color: var(--text-main); }

        .badge-level {
            background: linear-gradient(135deg, #ffd700, #ff8c00); color: white;
            padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; border-radius: 30px; display: none;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(79, 172, 254, 0.3);
            border-radius: 50%; border-top-color: var(--primary-blue);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .card {
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 20px;
            padding: 30px; margin-bottom: 25px;
        }

        .problem-text { font-size: 1.5rem; line-height: 1.6; margin-bottom: 20px; font-weight: 600; text-align: center;}

        .input-group { display: flex; flex-direction: column; gap: 20px; align-items: center; width: 100%; }

        .answer-input {
            width: 100%; max-width: 320px; padding: 15px 20px;
            font-size: 1.5rem; font-family: 'Nunito', sans-serif; text-align: center;
            border: 3px solid #cbd5e1; border-radius: 15px; outline: none; transition: border-color 0.3s;
        }
        .answer-input:focus { border-color: var(--primary-blue); }

        .numpad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 320px;
        }
        .num-btn {
            background: white; border: 2px solid #e2e8f0; border-radius: 15px;
            font-size: 1.8rem; font-family: 'Fredoka', sans-serif; color: var(--primary-blue);
            padding: 15px 0; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.1s; display: flex; justify-content: center; align-items: center;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .num-btn:active { transform: scale(0.92); background: #f1f5f9; }
        .num-btn.pink-text { color: var(--primary-pink); font-size: 1.4rem; }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white; border: none; padding: 15px 40px; font-size: 1.2rem; width: 100%; max-width: 320px;
            font-weight: bold; font-family: 'Nunito', sans-serif; border-radius: 25px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
            transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(79, 172, 254, 0.4); }
        .btn-primary:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }

        .feedback-msg {
            margin-top: 20px; padding: 15px; border-radius: 15px;
            text-align: center; font-size: 1.2rem; font-weight: 700; display: none; animation: fadeIn 0.3s;
        }
        .feedback-msg.success { background-color: #dcfce7; color: #166534; border: 2px solid #86efac; display: block; }
        .feedback-msg.error { background-color: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; display: block; }

        .dictation-controls { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; }
        
        .play-row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }

        .btn-play {
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            color: white; border: none; width: 80px; height: 80px; border-radius: 50%;
            font-size: 2rem; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3);
            transition: all 0.3s; display: flex; justify-content: center; align-items: center;
        }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(255, 117, 140, 0.4); }
        .btn-play.playing { animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 117, 140, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 117, 140, 0); }
        }

        .speed-control { display: flex; align-items: center; gap: 15px; background: #f1f5f9; padding: 10px 20px; border-radius: 20px; }
        .speed-control label { font-weight: 700; color: var(--text-light); }
        input[type=range] { -webkit-appearance: none; width: 150px; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--primary-pink); cursor: pointer; margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }

        .text-display {
            background: white; border: 2px dashed #cbd5e1; border-radius: 20px;
            padding: 30px; font-size: 1.6rem; line-height: 1.8; color: var(--text-main);
            min-height: 200px; text-align: center;
        }

        .sentence { transition: all 0.3s; padding: 2px 5px; border-radius: 5px; }
        .sentence.highlight {
            background-color: var(--highlight-bg); color: #000; font-weight: 700;
            border-bottom: 3px solid var(--primary-pink);
        }

        .btn-next-dictation {
            background: white; border: 2px solid var(--primary-pink); color: var(--primary-pink);
            padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 25px;
            cursor: pointer; margin-top: 20px; transition: all 0.2s; width: 100%;
        }
        .btn-next-dictation:hover { background: var(--primary-pink); color: white; }

        @media (max-width: 600px) {
            .home-menu { grid-template-columns: 1fr; }
            .header h1 { font-size: 2.2rem; }
            .problem-text { font-size: 1.2rem; }
            .text-display { font-size: 1.3rem; padding: 20px; }
            .speed-control { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <h3 style="margin-top: 20px; color: var(--primary-blue);">Un ratito Luchi...</h3>
        </div>

        <div class="content-wrapper">
            <div class="header">
                <img src="https://i.ibb.co/B5704YPp/asd-1-1.png" alt="Luce Logo">
                <h1>¡Hola Luchi! 🌟</h1>
                <p>¿Qué aventura vamos a elegir hoy?</p>
            </div>

            <div id="view-home" class="view active">
                <div class="home-menu">
                    <button class="menu-btn blue" onclick="startMath()">
                        <i class="fa-solid fa-calculator"></i>
                        <span>Problemas<br>Matemáticos</span>
                    </button>
                    <button class="menu-btn pink" onclick="startDictation()">
                        <i class="fa-solid fa-pencil"></i>
                        <span>Dictados<br>Divertidos</span>
                    </button>
                </div>
            </div>

            <div id="view-math" class="view">
                <div class="top-bar">
                    <button class="btn-back" onclick="goHome()">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </button>
                    <div class="badge-level" id="math-level-badge">Nivel: 1</div>
                </div>

                <div class="card">
                    <div class="problem-text" id="math-question"></div>
                    <div class="input-group" id="math-input-group">
                        <input type="text" id="math-answer" class="answer-input" placeholder="Toca aquí para escribir letras..." autocomplete="off">
                        
                        <div class="numpad" id="math-numpad">
                            <button class="num-btn" onclick="typeNum('1')">1</button>
                            <button class="num-btn" onclick="typeNum('2')">2</button>
                            <button class="num-btn" onclick="typeNum('3')">3</button>
                            <button class="num-btn" onclick="typeNum('4')">4</button>
                            <button class="num-btn" onclick="typeNum('5')">5</button>
                            <button class="num-btn" onclick="typeNum('6')">6</button>
                            <button class="num-btn" onclick="typeNum('7')">7</button>
                            <button class="num-btn" onclick="typeNum('8')">8</button>
                            <button class="num-btn" onclick="typeNum('9')">9</button>
                            <button class="num-btn pink-text" onclick="typeNum(' ')"><i class="fa-solid fa-minus"></i></button>
                            <button class="num-btn" onclick="typeNum('0')">0</button>
                            <button class="num-btn pink-text" onclick="deleteNum()"><i class="fa-solid fa-delete-left"></i></button>
                        </div>

                        <button class="btn-primary" id="btn-check-math" onclick="checkMathAnswer()">
                            <i class="fa-solid fa-check"></i> ¡Comprobar!
                        </button>
                    </div>
                    <div id="math-feedback" class="feedback-msg"></div>
                </div>
                
                <button id="btn-next-math" class="btn-primary" style="width: 100%; display: none; background: linear-gradient(135deg, #10b981, #059669);" onclick="loadNextMath()">
                    Siguiente Problema <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <div id="view-dictation" class="view">
                <div class="top-bar">
                    <button class="btn-back" onclick="goHome()">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </button>
                    <div class="badge-level" style="background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));">
                        ¡A escribir! 📝
                    </div>
                </div>

                <div class="dictation-controls">
                    <div class="play-row">
                        <button class="btn-play" id="btn-play-dictation" onclick="playCurrentSentence()">
                            <i class="fa-solid fa-play" id="play-icon"></i>
                        </button>
                        <button class="btn-primary" id="btn-next-sentence" onclick="nextSentence()" style="display: none; max-width: 250px;">
                            Siguiente Oración <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                    
                    <div class="speed-control">
                        <label for="speech-speed"><i class="fa-solid fa-gauge"></i> Velocidad:</label>
                        <input type="range" id="speech-speed" min="0.2" max="1" step="0.1" value="0.5">
                        <span id="speed-value" style="font-weight:bold; color:var(--primary-pink);">Lenta</span>
                    </div>
                </div>

                <div class="text-display" id="dictation-text"></div>

                <button class="btn-next-dictation" id="btn-load-next-dict" onclick="loadNextDictation()">
                    <i class="fa-solid fa-forward-step"></i> Cargar otro dictado
                </button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoclGcBVqQdOZBKsjgB07ErrN-D9mCw28-POadcWHwKiReOCVRPvcbWVcq-Xxdxlcz/exec'; 
        
        let currentMathProblem = null;
        let consecutiveMathWins = 0;
        let currentDifficultyLevel = 1;
        
        let currentDictationId = null;
        let currentDictationText = "";
        let dictationSentences = [];
        let currentSentenceIndex = 0;
        let speechSynthesis = window.speechSynthesis;
        let speechUtterance = null;

        const successMessages = [
            "¡Excelente Luchi! Eres una genia. 🌟",
            "¡Perfecto! Lo hiciste increíble Luz. 🎉",
            "¡Wow! Qué rápida y precisa. ¡Sigue así! 🚀",
            "¡Correctísimo! Choca esos cinco ✋"
        ];
        
        const errorMessages = [
            "¡Casi casi Luchi! Revisalo con papá y seguimos. 💪",
            "Ups, no pasa nada Luz. De los errores se aprende. ¡Vamos al próximo! 🌈",
            "Mmm, parece que no es eso. ¡Hagamos otro, tú puedes! ✨",
            "Tranquila Luchi, velo con tu papá y a la próxima sale seguro. 😉"
        ];

        async function fetchApi(action, params = {}) {
            params.action = action;
            const options = {
                method: 'POST',
                body: JSON.stringify(params)
            };
            const response = await fetch(SCRIPT_URL, options);
            return await response.json();
        }

        function typeNum(char) {
            const input = document.getElementById('math-answer');
            input.value += char;
        }

        function deleteNum() {
            const input = document.getElementById('math-answer');
            input.value = input.value.slice(0, -1);
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId !== 'view-dictation') stopDictation();
        }

        function goHome() {
            showView('view-home');
            document.querySelector('.header p').innerText = "¿Qué aventura vamos a elegir hoy?";
        }

        function showLoading(show) {
            document.getElementById('loadingOverlay').classList.toggle('active', show);
        }

        function getRandomMessage(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startMath() {
            showView('view-math');
            document.querySelector('.header p').innerText = "¡A pensar fuerte, Luchi!";
            document.getElementById('math-input-group').style.display = 'flex';
            document.getElementById('math-answer').disabled = false;
            loadNextMath();
        }

        async function loadNextMath() {
            showLoading(true);
            document.getElementById('math-answer').value = '';
            document.getElementById('math-input-group').style.display = 'flex';
            document.getElementById('math-answer').disabled = false;
            document.getElementById('btn-next-math').style.display = 'none';
            document.getElementById('math-feedback').className = 'feedback-msg';
            document.getElementById('math-level-badge').innerText = `Nivel: ${currentDifficultyLevel}`;

            try {
                const problem = await fetchApi('getMath', { level: currentDifficultyLevel });
                onMathProblemLoaded(problem && problem.rowId ? problem : null);
            } catch (error) {
                onServerError(error);
            }
        }

        function onMathProblemLoaded(problem) {
            showLoading(false);
            if (!problem) {
                document.getElementById('math-question').innerText = "¡Felicitaciones! 🎉 Los has resuelto todos. Ve con tu papá a pedirle más ejercicios.";
                document.getElementById('math-input-group').style.display = 'none';
                triggerConfetti();
                return;
            }
            currentMathProblem = problem;
            document.getElementById('math-question').innerText = problem.enunciado;
        }

        async function checkMathAnswer() {
            const userAnswer = document.getElementById('math-answer').value.trim();
            if (!userAnswer) return;

            showLoading(true);
            document.getElementById('math-input-group').style.display = 'none';

            try {
                const data = await fetchApi('checkMath', {
                    rowId: currentMathProblem.rowId,
                    userAnswer: userAnswer,
                    expectedAnswer: currentMathProblem.respuestaEsperada
                });
                onMathChecked(data.isCorrect);
            } catch (error) {
                onServerError(error);
            }
        }

        function onMathChecked(isCorrect) {
            showLoading(false);
            const feedbackEl = document.getElementById('math-feedback');
            
            if (isCorrect) {
                consecutiveMathWins++;
                if (consecutiveMathWins >= 2 && currentDifficultyLevel < 5) {
                    currentDifficultyLevel++;
                    consecutiveMathWins = 0;
                }
                feedbackEl.innerText = getRandomMessage(successMessages);
                feedbackEl.className = 'feedback-msg success';
                triggerConfetti();
            } else {
                consecutiveMathWins = 0;
                if (currentDifficultyLevel > 1) currentDifficultyLevel--;
                feedbackEl.innerText = getRandomMessage(errorMessages);
                feedbackEl.className = 'feedback-msg error';
            }
            document.getElementById('btn-next-math').style.display = 'flex';
        }

        document.getElementById('math-answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkMathAnswer();
        });

        document.getElementById('speech-speed').addEventListener('input', function(e) {
            const val = parseFloat(e.target.value);
            const label = document.getElementById('speed-value');
            if(val <= 0.4) label.innerText = "Muy Lenta 🐢";
            else if(val <= 0.7) label.innerText = "Lenta 🚶‍♀️";
            else label.innerText = "Normal 🏃‍♀️";
        });

        function startDictation() {
            showView('view-dictation');
            document.querySelector('.header p').innerText = "Escucha atenta y escribe bonito en tu hoja.";
            document.querySelector('.play-row').style.display = 'flex';
            document.getElementById('btn-load-next-dict').style.display = 'block';
            currentDictationId = null;
            loadNextDictation();
        }

        async function loadNextDictation() {
            stopDictation();
            showLoading(true);
            
            if (currentDictationId) {
                fetchApi('markDictation', { rowId: currentDictationId }).catch(e => console.log(e));
                currentDictationId = null;
            }

            document.getElementById('dictation-text').innerHTML = '';
            document.getElementById('btn-next-sentence').style.display = 'none';
            document.querySelector('.play-row').style.display = 'flex';
            document.getElementById('btn-load-next-dict').style.display = 'block';
            
            try {
                const data = await fetchApi('getDictation');
                onDictationLoaded(data && data.rowId ? data : null);
            } catch (error) {
                onServerError(error);
            }
        }

        function onDictationLoaded(data) {
            showLoading(false);
            if (!data) {
                document.getElementById('dictation-text').innerHTML = "<br>¡Felicitaciones! 🎉 Los has resuelto todos. Ve con tu papá a pedirle más ejercicios.";
                document.querySelector('.play-row').style.display = 'none';
                document.getElementById('btn-load-next-dict').style.display = 'none';
                triggerConfetti();
                return;
            }
            
            currentDictationId = data.rowId;
            currentDictationText = data.texto;
            let rawSentences = data.texto.split(/(?<=\.)\s+/);
            dictationSentences = rawSentences.filter(s => s.trim().length > 0);
            currentSentenceIndex = 0;
            
            let htmlContent = '';
            dictationSentences.forEach((sentence, index) => {
                htmlContent += `<span id="sent-${index}" class="sentence">${sentence} </span>`;
            });
            document.getElementById('dictation-text').innerHTML = htmlContent;
        }

        function playCurrentSentence() {
            if (dictationSentences.length === 0) return;
            speechSynthesis.cancel();
            
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
            const currentSpan = document.getElementById(`sent-${currentSentenceIndex}`);
            if(currentSpan) currentSpan.classList.add('highlight');

            speechUtterance = new SpeechSynthesisUtterance(dictationSentences[currentSentenceIndex]);
            speechUtterance.lang = 'es-ES'; 
            speechUtterance.rate = parseFloat(document.getElementById('speech-speed').value); 

            speechUtterance.onstart = function() {
                updatePlayButtonUI(true);
            };

            speechUtterance.onend = function() {
                updatePlayButtonUI(false);
                if (currentSentenceIndex < dictationSentences.length - 1) {
                    document.getElementById('btn-next-sentence').style.display = 'flex';
                } else {
                    document.getElementById('btn-next-sentence').style.display = 'none';
                    triggerConfetti();
                }
            };

            speechUtterance.onerror = function(e) {
                console.error(e);
                updatePlayButtonUI(false);
            };

            speechSynthesis.speak(speechUtterance);
        }

        function nextSentence() {
            if (currentSentenceIndex < dictationSentences.length - 1) {
                currentSentenceIndex++;
                document.getElementById('btn-next-sentence').style.display = 'none';
                playCurrentSentence();
            }
        }

        function stopDictation() {
            speechSynthesis.cancel();
            updatePlayButtonUI(false);
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('highlight'));
        }

        function updatePlayButtonUI(isPlaying) {
            const btn = document.getElementById('btn-play-dictation');
            const icon = document.getElementById('play-icon');
            if (isPlaying) {
                btn.classList.add('playing');
                icon.className = 'fa-solid fa-volume-high';
            } else {
                btn.classList.remove('playing');
                icon.className = 'fa-solid fa-play';
            }
        }

        function onServerError(error) {
            showLoading(false);
            console.error(error);
            alert("Hubo un problemita de conexión. ¡Prueba de nuevo, Luchi!");
        }
    </script>
</body>
</html>
